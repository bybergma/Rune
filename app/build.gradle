plugins {
    id 'com.android.application'
}

android {
    namespace 'se.runeslasaventyr'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('rune-debug.keystore')
            storePassword 'rune1234'
            keyAlias 'rune'
            keyPassword 'rune1234'
        }
    }

    defaultConfig {
        applicationId "se.runeslasaventyr"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "0.9"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
